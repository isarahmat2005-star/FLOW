<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO by IRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Loader */
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- SIDEBAR CONTROL PANEL -->
    <aside class="w-full md:w-96 bg-white border-r border-slate-200 shadow-sm flex flex-col h-full z-10 flex-shrink-0 overflow-y-auto">
        <!-- Header -->
        <div class="p-6 border-b border-slate-200 sticky top-0 bg-white z-20 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">STUDIO</h1>
                <p class="text-xs font-semibold text-indigo-600 tracking-widest uppercase mt-0.5">by IRS</p>
            </div>
            <i class="fa-solid fa-wand-magic-sparkles text-indigo-500 text-xl"></i>
        </div>

        <div class="p-6 flex-1 flex flex-col gap-6">
            
            <!-- API Configuration -->
            <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <div class="flex justify-between items-center">
                    <label class="text-xs font-bold text-slate-700 uppercase tracking-wider"><i class="fa-solid fa-key mr-1"></i> API Token</label>
                    <a href="https://labs.google/fx/api/auth/session" target="_blank" class="text-[10px] font-bold text-indigo-600 hover:text-indigo-800 bg-indigo-50 px-2 py-1 rounded">Get Token</a>
                </div>
                <input type="password" id="apiToken" placeholder="Paste 'ya29...' token" class="w-full p-2.5 text-xs font-mono border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <!-- Media Type Selection -->
            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button id="btnImage" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-slate-800 transition-all"><i class="fa-regular fa-image mr-1"></i> Image</button>
                <button id="btnVideo" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-800 transition-all"><i class="fa-solid fa-play mr-1"></i> Video</button>
            </div>

            <!-- Configurations -->
            <div class="space-y-4">
                
                <!-- Aspect Ratio -->
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">Aspect Ratio</label>
                    <div class="grid grid-cols-5 gap-1" id="ratioContainer">
                        <button class="ratio-btn py-2 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="16:9"><div class="w-4 h-2.5 border-2 border-current mx-auto mb-1"></div>16:9</button>
                        <button class="ratio-btn py-2 border-2 border-indigo-500 bg-indigo-50 text-indigo-700 rounded-md text-xs font-bold transition-all" data-value="1:1"><div class="w-3 h-3 border-2 border-current mx-auto mb-1"></div>1:1</button>
                        <button class="ratio-btn py-2 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="4:3"><div class="w-3.5 h-2.5 border-2 border-current mx-auto mb-1"></div>4:3</button>
                        <button class="ratio-btn py-2 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="3:4"><div class="w-2.5 h-3.5 border-2 border-current mx-auto mb-1"></div>3:4</button>
                        <button class="ratio-btn py-2 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="9:16"><div class="w-2 h-3.5 border-2 border-current mx-auto mb-1"></div>9:16</button>
                    </div>
                </div>

                <!-- Generation Count -->
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">Batch Size</label>
                    <div class="grid grid-cols-4 gap-2" id="countContainer">
                        <button class="count-btn py-1.5 border-2 border-indigo-500 bg-indigo-50 text-indigo-700 rounded-md text-xs font-bold transition-all" data-value="1">x1</button>
                        <button class="count-btn py-1.5 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="2">x2</button>
                        <button class="count-btn py-1.5 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="3">x3</button>
                        <button class="count-btn py-1.5 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all" data-value="4">x4</button>
                    </div>
                </div>

                <!-- Model Selection -->
                <div>
                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">AI Model</label>
                    <select id="modelSelect" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-indigo-500 outline-none cursor-pointer">
                        <option value="NANO_BANANA_PRO">🍌 Nano Banana Pro</option>
                        <option value="NANO_BANANA_2">🍌 Nano Banana 2</option>
                        <option value="IMAGEN_4">✨ Imagen 4</option>
                    </select>
                </div>
                
                <!-- Prompt Input -->
                <div class="pt-2">
                    <label class="text-xs font-bold text-slate-500 block mb-2 uppercase">Prompt Idea</label>
                    <textarea id="promptInput" rows="4" placeholder="Describe what you want to see..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none text-sm transition-all shadow-inner"></textarea>
                </div>

            </div>
        </div>

        <!-- Action Area -->
        <div class="p-6 bg-slate-50 border-t border-slate-200 sticky bottom-0 z-20">
            <button id="generateBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-sparkles"></i> Generate Content
            </button>
            <div id="statusMsg" class="mt-3 text-xs text-center font-medium hidden"></div>
        </div>
    </aside>

    <!-- MAIN GALLERY AREA -->
    <main class="flex-1 flex flex-col h-full bg-slate-100 overflow-hidden relative">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between flex-shrink-0 shadow-sm z-10">
            <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-layer-group"></i> Output Gallery <span id="galleryCount" class="text-slate-400 font-normal ml-1">(0)</span>
            </h2>
            <div class="flex items-center gap-3">
                <div class="flex items-center bg-slate-100 rounded-md p-1 border border-slate-200">
                    <label class="text-xs font-bold text-slate-500 px-2">Download Res:</label>
                    <select id="downloadRes" class="bg-white border border-slate-300 text-xs rounded px-2 py-1 outline-none font-medium cursor-pointer">
                        <option value="1K">1K Standard</option>
                        <option value="2K">2K High-Res</option>
                    </select>
                </div>
                <button id="clearBtn" class="px-3 py-1.5 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 rounded-md transition-all">Clear All</button>
            </div>
        </header>

        <!-- Gallery Grid -->
        <div id="gallery" class="flex-1 overflow-y-auto p-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 content-start">
            <!-- Empty State -->
            <div id="emptyState" class="col-span-full h-full min-h-[60vh] flex flex-col items-center justify-center text-slate-400">
                <i class="fa-regular fa-image text-6xl mb-4 text-slate-300"></i>
                <p class="text-lg font-medium text-slate-500">The canvas is empty</p>
                <p class="text-sm">Configure your settings and hit generate.</p>
            </div>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-indigo-600 rounded-full loader mb-4"></div>
            <p class="text-slate-700 font-bold tracking-wide">Processing your request...</p>
        </div>
    </main>

    <script>
        // State Variables
        let state = {
            mediaType: 'image',
            aspectRatio: '1:1',
            count: 1,
            images: []
        };

        // DOM Elements
        const DOM = {
            btnImage: document.getElementById('btnImage'),
            btnVideo: document.getElementById('btnVideo'),
            ratioBtns: document.querySelectorAll('.ratio-btn'),
            countBtns: document.querySelectorAll('.count-btn'),
            generateBtn: document.getElementById('generateBtn'),
            clearBtn: document.getElementById('clearBtn'),
            gallery: document.getElementById('gallery'),
            emptyState: document.getElementById('emptyState'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            galleryCount: document.getElementById('galleryCount'),
            statusMsg: document.getElementById('statusMsg')
        };

        // Event Listeners for UI Selection
        DOM.btnImage.addEventListener('click', () => {
            state.mediaType = 'image';
            DOM.btnImage.className = 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-slate-800 transition-all';
            DOM.btnVideo.className = 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-800 transition-all';
        });

        DOM.btnVideo.addEventListener('click', () => {
            state.mediaType = 'video';
            DOM.btnVideo.className = 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-slate-800 transition-all';
            DOM.btnImage.className = 'flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-800 transition-all';
        });

        DOM.ratioBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                DOM.ratioBtns.forEach(b => b.className = 'ratio-btn py-2 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all');
                const target = e.currentTarget;
                target.className = 'ratio-btn py-2 border-2 border-indigo-500 bg-indigo-50 text-indigo-700 rounded-md text-xs font-bold transition-all';
                state.aspectRatio = target.dataset.value;
            });
        });

        DOM.countBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                DOM.countBtns.forEach(b => b.className = 'count-btn py-1.5 border border-slate-200 bg-white hover:bg-slate-50 rounded-md text-xs font-medium transition-all');
                const target = e.currentTarget;
                target.className = 'count-btn py-1.5 border-2 border-indigo-500 bg-indigo-50 text-indigo-700 rounded-md text-xs font-bold transition-all';
                state.count = parseInt(target.dataset.value);
            });
        });

        DOM.clearBtn.addEventListener('click', () => {
            if(confirm("Hapus semua hasil dari galeri?")) {
                state.images = [];
                renderGallery();
            }
        });

        // Generate Logic
        DOM.generateBtn.addEventListener('click', async () => {
            const token = document.getElementById('apiToken').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const model = document.getElementById('modelSelect').value;

            if (!token) return showStatus("Token dibutuhkan!", "error");
            if (!prompt) return showStatus("Prompt tidak boleh kosong!", "error");

            DOM.loadingOverlay.classList.remove('hidden');
            showStatus("", "");

            try {
                // Logika format payload untuk endpoint whisk
                const payload = {
                    clientContext: { tool: "BACKBONE" },
                    imageModelSettings: { 
                        imageModel: model, 
                        aspectRatio: state.aspectRatio === "16:9" ? "IMAGE_ASPECT_RATIO_LANDSCAPE" : 
                                     state.aspectRatio === "9:16" ? "IMAGE_ASPECT_RATIO_PORTRAIT" : 
                                     "IMAGE_ASPECT_RATIO_SQUARE" 
                    },
                    mediaCategory: state.mediaType === 'video' ? "MEDIA_CATEGORY_VIDEO" : "MEDIA_CATEGORY_BOARD",
                    prompt: prompt,
                    sampleCount: state.count
                };

                const response = await fetch('https://aisandbox-pa.googleapis.com/v1/whisk:generateImage', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                // Ekstraksi data simulasi berdasarkan pola Google Labs
                if(data && data.imagePanels) {
                   // Logika parsing aktual menyesuaikan struktur JSON balasan
                   // Disini kita asumsikan base64 diekstrak
                   showStatus("Berhasil di-generate!", "success");
                } else {
                    throw new Error("Format respons tidak dikenali.");
                }

            } catch (err) {
                console.error(err);
                showStatus("Gagal: " + err.message, "error");
            } finally {
                DOM.loadingOverlay.classList.add('hidden');
            }
        });

        function showStatus(msg, type) {
            DOM.statusMsg.textContent = msg;
            DOM.statusMsg.className = `mt-3 text-xs text-center font-medium p-2 rounded ${
                type === 'error' ? 'bg-red-50 text-red-600 border border-red-200 block' : 
                type === 'success' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200 block' : 'hidden'
            }`;
        }

        function renderGallery() {
            // Logika render ke DOM (Dikosongkan untuk preview statis)
            if(state.images.length === 0) {
                DOM.emptyState.classList.remove('hidden');
            } else {
                DOM.emptyState.classList.add('hidden');
            }
            DOM.galleryCount.textContent = `(${state.images.length})`;
        }
    </script>
</body>
  </html>
